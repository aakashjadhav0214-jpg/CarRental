version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/rental.db:/app/rental.db
    environment:
      - ENVIRONMENT=production

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
